name: smart_city_app
description: "Ứng dụng di động Smart City Đà Nẵng — người dân báo cáo sự cố, cán bộ xử lý tại hiện trường."
publish_to: 'none'

# versionName+versionCode. Server so sánh phần trước dấu "+" với
# minSupportedVersion ở GET /api/app/config (task 0.8).
version: 1.0.0+1

environment:
  # Pin đúng bản đã kiểm chứng trên máy phát triển (Phase 0.0d của kế hoạch).
  sdk: ^3.11.1
  flutter: ">=3.41.4"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State + routing
  flutter_riverpod: ^2.6.1
  go_router: ^17.5.0

  # Mạng + realtime
  dio: ^5.11.1
  socket_io_client: ^3.1.6
  connectivity_plus: ^7.3.2

  # Lưu trữ: refresh token vào Keychain/Keystore, hàng đợi offline vào Hive
  flutter_secure_storage: ^11.2.0
  shared_preferences: ^2.5.5
  hive_ce: ^2.20.1
  hive_ce_flutter: ^2.3.4

  # Bản đồ + vị trí
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  geolocator: ^14.0.1

  # Ảnh
  image_picker: ^1.2.3
  flutter_image_compress: ^2.5.1
  crypto: ^3.0.7

  # Thiết bị + mở ứng dụng ngoài
  device_info_plus: ^13.3.0
  package_info_plus: ^10.2.2
  url_launcher: ^6.3.2
  webview_flutter: ^4.14.1

  # Hiển thị
  intl: any # bản do flutter_localizations ghim
  fl_chart: ^1.2.0
  collection: ^1.19.1
  cupertino_icons: ^1.0.8
  google_sign_in: ^7.2.0
  flutter_svg: ^2.3.0
  share_plus: ^13.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  fake_async: ^1.3.3
  google_sign_in_platform_interface: ^3.1.0

flutter:
  uses-material-design: true

  # Be Vietnam Pro — thiết kế riêng cho tiếng Việt (dấu xếp chồng không bị cắt).
  # Nhúng sẵn, không tải qua mạng: app phải mở được và soạn phiếu khi offline.
  # Giấy phép SIL OFL 1.1 — assets/fonts/OFL.txt.
  assets:
    - assets/fonts/OFL.txt
    # Logo màn chờ (SplashScreen) và ô logo trong header / màn đăng nhập. Các ảnh
    # khác trong assets/branding chỉ là nguồn để sinh icon / màn chờ native — không
    # đóng vào app.
    - assets/branding/splash_logo.png
    - assets/branding/logo_tile.png

  fonts:
    - family: BeVietnamPro
      fonts:
        - asset: assets/fonts/BeVietnamPro-Regular.ttf
          weight: 400
        - asset: assets/fonts/BeVietnamPro-Medium.ttf
          weight: 500
        - asset: assets/fonts/BeVietnamPro-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/BeVietnamPro-Bold.ttf
          weight: 700
        - asset: assets/fonts/BeVietnamPro-ExtraBold.ttf
          weight: 800
